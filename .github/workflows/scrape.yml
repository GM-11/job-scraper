name: scrape
on:
  schedule:
    - cron: "0 3,8,12,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m scraper.main --tier all
        env:
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet && exit 0

          git commit -m "chore: update seen jobs"

          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done

          echo "Failed to push after 5 attempts"
          exit 1
