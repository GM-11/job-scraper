name: scrape
on:
  schedule:
    # Deliberately not on the hour. GitHub runs scheduled workflows on a
    # best-effort basis and drops them under load; ":00" is the most contended
    # minute, so an off-peak minute gets dropped less often.
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Force apt to use IPv4
        # apt-get update (run internally by `playwright install --with-deps`)
        # can hang for hours on the azure.archive.ubuntu.com mirror when the
        # runner's IPv6 route to it stalls instead of failing fast.
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: Install Playwright chromium
        timeout-minutes: 20
        run: playwright install --with-deps chromium
      - run: python -m scraper.main --tier all
        env:
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
      - name: Commit updated seen_jobs.json
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet && exit 0

          git commit -m "chore: update seen jobs"

          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push attempt $attempt failed, merging remote changes..."
            sleep $((attempt * 5))

            # Another run pushed first. seen_jobs.json is a dict keyed by job,
            # so the correct resolution is the union of both sides -- merge it
            # explicitly rather than letting git attempt a line-based merge,
            # which conflicts whenever both sides appended entries.
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:data/seen_jobs.json" > /tmp/remote_seen.json \
              || echo '{}' > /tmp/remote_seen.json
            python scripts/merge_seen_jobs.py \
              data/seen_jobs.json /tmp/remote_seen.json /tmp/merged_seen.json

            git reset --hard "origin/$BRANCH"
            cp /tmp/merged_seen.json data/seen_jobs.json
            git add data/seen_jobs.json
            git diff --staged --quiet && exit 0
            git commit -m "chore: update seen jobs"
          done

          echo "Failed to push after 5 attempts"
          exit 1
