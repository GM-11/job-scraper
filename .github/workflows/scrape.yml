name: scrape
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Force apt to use IPv4
        # apt-get update (run internally by `playwright install --with-deps`)
        # can hang for hours on the azure.archive.ubuntu.com mirror when the
        # runner's IPv6 route to it stalls instead of failing fast.
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: Install Playwright chromium
        timeout-minutes: 20
        run: playwright install --with-deps chromium
      - run: python -m scraper.main --tier all
        env:
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet && exit 0

          git commit -m "chore: update seen jobs"

          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done

          echo "Failed to push after 5 attempts"
          exit 1
